name: CodeQL

# Disabled: push / pull_request / schedule triggers are commented out so the
# workflow no longer runs automatically. Manual dispatch is preserved so the
# job can still be invoked from the Actions UI when needed. Re-enable by
# uncommenting the triggers below.
on:
  # push:
  #   branches: ["main", "milestone/**"]
  # pull_request:
  #   branches: ["main", "milestone/**"]
  # schedule:
  #   - cron: "0 4 * * 1"  # weekly on Monday at 4am UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    continue-on-error: true  # requires GitHub Code Security to be enabled; non-blocking until repository is configured
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        with:
          languages: go
          queries: security-and-quality

      - name: Build for CodeQL
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        with:
          category: "/language:go"
