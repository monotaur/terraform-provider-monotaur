name: CodeQL

# Static analysis with CodeQL. Runs on pushes and PRs to main, weekly on a
# schedule, and on manual dispatch. CodeQL is free for public repositories;
# results appear under the repository's Security → Code scanning tab once
# GitHub Code Security is enabled in repo settings.
on:
  push:
    branches: ["main", "milestone/**"]
  pull_request:
    branches: ["main", "milestone/**"]
  schedule:
    - cron: "0 4 * * 1"  # weekly on Monday at 4am UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    continue-on-error: true  # requires GitHub Code Security to be enabled; non-blocking until repository is configured
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@87557b9c84dde89fdd9b10e88954ac2f4248e463  # v4.36.1
        with:
          languages: go
          queries: security-and-quality

      - name: Build for CodeQL
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@87557b9c84dde89fdd9b10e88954ac2f4248e463  # v4.36.1
        with:
          category: "/language:go"
