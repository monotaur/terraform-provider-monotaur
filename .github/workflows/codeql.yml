name: CodeQL

# Disabled: push / pull_request / schedule triggers are commented out so the
# workflow no longer runs automatically. Manual dispatch is preserved so the
# job can still be invoked from the Actions UI when needed. Re-enable by
# uncommenting the triggers below.
on:
  # push:
  #   branches: ["main", "milestone/**"]
  # pull_request:
  #   branches: ["main", "milestone/**"]
  # schedule:
  #   - cron: "0 4 * * 1"  # weekly on Monday at 4am UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    continue-on-error: true  # requires GitHub Code Security to be enabled; non-blocking until repository is configured
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          languages: go
          queries: security-and-quality

      - name: Build for CodeQL
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          category: "/language:go"
