name: E2E Sweep (nightly)

# Parked: the nightly E2E workflow now runs against an ephemeral KIND cluster
# (see e2e.yml), so there is no shared staging environment to sweep. The cron
# trigger is commented out to stop the workflow firing against unconfigured
# MONOTAUR_STAGING_* secrets. Manual dispatch is preserved so the job can still
# be run against staging if/when those secrets are wired up again.
on:
  # schedule:
  #   - cron: "0 3 * * *"  # 03:00 UTC daily — disabled, see header comment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Sweep staging resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Sweep staging resources
        env:
          MONOTAUR_ENDPOINT: ${{ secrets.MONOTAUR_STAGING_ENDPOINT }}
          MONOTAUR_API_KEY: ${{ secrets.MONOTAUR_STAGING_API_KEY }}
          TF_ACC: "1"
        run: make e2e-sweep

      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sweep-results
          path: e2e-results/sweep.txt
          if-no-files-found: warn
