name: E2E Sweep (nightly)

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Sweep staging resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Sweep staging resources
        env:
          MONOTAUR_ENDPOINT: ${{ secrets.MONOTAUR_STAGING_ENDPOINT }}
          MONOTAUR_API_KEY: ${{ secrets.MONOTAUR_STAGING_API_KEY }}
          TF_ACC: "1"
        run: make e2e-sweep

      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sweep-results
          path: e2e-results/sweep.txt
          if-no-files-found: warn
