name: E2E Tests

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC nightly
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write  # comment on PRs
  packages: read        # pull ghcr.io/monotaur/* with GITHUB_TOKEN

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Only run when: scheduled, manual, or PR labeled 'run-e2e'
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-e2e')

    env:
      NAMESPACE: monotaur
      MONOTAUR_RELEASE: monotaur
      MONOTAUR_SERVICE: monotaur-monotaur-core
      MONOTAUR_PORT: "5000"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create KIND cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.17.0

      - name: Create namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: Install PostgreSQL (Bitnami)
        run: |
          helm install pg oci://registry-1.docker.io/bitnamicharts/postgresql \
            --namespace "$NAMESPACE" \
            --set auth.username=monotaur \
            --set auth.database=monotaur \
            --set auth.password=testpassword123 \
            --set primary.persistence.enabled=false \
            --set readReplicas.persistence.enabled=false \
            --wait --timeout 5m

      - name: Install Redis (Bitnami)
        run: |
          helm install rd oci://registry-1.docker.io/bitnamicharts/redis \
            --namespace "$NAMESPACE" \
            --set auth.enabled=false \
            --set master.persistence.enabled=false \
            --set replica.replicaCount=0 \
            --wait --timeout 5m

      - name: Create Monotaur prerequisite Secrets
        run: |
          kubectl -n "$NAMESPACE" create secret generic monotaur-postgres \
            --from-literal=connection-string='Host=pg-postgresql;Port=5432;Database=monotaur;Username=monotaur;Password=testpassword123'
          kubectl -n "$NAMESPACE" create secret generic monotaur-redis \
            --from-literal=connection-string='rd-redis-master:6379'
          kubectl -n "$NAMESPACE" create secret generic monotaur-api-keys \
            --from-literal=monotaur-worker=ci-dummy-worker-key

      - name: Create GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PACKAGES_READ_TOKEN }}
        run: |
          kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_TOKEN"

      - name: Log Helm into GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PACKAGES_READ_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Install Monotaur chart
        run: |
          helm install "$MONOTAUR_RELEASE" oci://ghcr.io/monotaur/charts/monotaur-chart \
            --namespace "$NAMESPACE" \
            --values scripts/ci-values.yaml \
            --wait --timeout 10m

      - name: Extract bootstrap API key
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          DEPLOYMENT: ${{ env.MONOTAUR_SERVICE }}
        run: bash scripts/ci-extract-bootstrap-key.sh

      - name: Port-forward Monotaur API
        run: |
          mkdir -p e2e-results
          nohup kubectl -n "$NAMESPACE" port-forward \
            "svc/$MONOTAUR_SERVICE" "$MONOTAUR_PORT:$MONOTAUR_PORT" \
            > e2e-results/port-forward.log 2>&1 &
          echo $! > e2e-results/port-forward.pid
          # Wait for the tunnel to accept connections.
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$MONOTAUR_PORT/health" >/dev/null 2>&1; then
              echo "Port-forward is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Port-forward never came up" >&2
          cat e2e-results/port-forward.log >&2
          exit 1

      - name: Run E2E suite
        env:
          MONOTAUR_ENDPOINT: http://127.0.0.1:5000
          TF_ACC: "1"
        run: make e2e

      - name: Collect cluster diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p e2e-results/cluster-diag
          kubectl -n "$NAMESPACE" get pods,jobs,svc,events \
            --sort-by=.metadata.creationTimestamp \
            > e2e-results/cluster-diag/overview.txt 2>&1
          helm -n "$NAMESPACE" status "$MONOTAUR_RELEASE" \
            > e2e-results/cluster-diag/helm-status.txt 2>&1
          for pod in $(kubectl -n "$NAMESPACE" get pods -o name); do
            safe=$(echo "$pod" | tr '/' '-')
            kubectl -n "$NAMESPACE" describe "$pod" \
              > "e2e-results/cluster-diag/${safe}.describe.txt" 2>&1
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --tail=500 \
              > "e2e-results/cluster-diag/${safe}.logs.txt" 2>&1
          done
          cp e2e-results/port-forward.log e2e-results/cluster-diag/ 2>/dev/null
          exit 0

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-results
          path: |
            e2e-results/junit.xml
            e2e-results/summary.md
            e2e-results/raw.jsonl
            e2e-results/sweep.txt
            e2e-results/port-forward.log
            e2e-results/cluster-diag/**
          if-no-files-found: ignore

      - name: Comment on PR with results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let summary = 'E2E tests failed. No summary.md found.';
            try {
              summary = fs.readFileSync('e2e-results/summary.md', 'utf8');
            } catch (e) {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## E2E Test Results\n\n${summary}`
            });

      - name: Stop port-forward
        if: always()
        run: |
          if [ -f e2e-results/port-forward.pid ]; then
            kill "$(cat e2e-results/port-forward.pid)" 2>/dev/null || true
          fi
