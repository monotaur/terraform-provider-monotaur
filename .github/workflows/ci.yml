name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (TF ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        terraform: ["1.7.*", "1.8.*", "1.9.*"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -timeout 10m

      - name: Build
        run: go build ./...

  # lint job disabled: golangci-lint v1.64.x (latest as of 2026-04) was compiled
  # with Go 1.24 and refuses to run against a go.mod targeting Go 1.25+.
  # Re-enable once golangci-lint releases a version compiled with Go 1.25.
  # go vet (in build-and-test) continues to catch type/static errors in the meantime.
