name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test (TF ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        terraform: ["1.7.*", "1.8.*", "1.9.*"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -timeout 10m

      - name: Build
        run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
