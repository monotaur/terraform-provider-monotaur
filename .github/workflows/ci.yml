name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (TF ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        terraform: ["1.7.*", "1.8.*", "1.9.*"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -timeout 10m

      - name: Build
        run: go build ./...

  # lint job disabled: golangci-lint v1.64.x (latest as of 2026-04) was compiled
  # with Go 1.24 and refuses to run against a go.mod targeting Go 1.25+.
  # Re-enable once golangci-lint releases a version compiled with Go 1.25.
  # go vet (in build-and-test) continues to catch type/static errors in the meantime.
