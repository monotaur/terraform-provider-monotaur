name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (TF ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        terraform: ["1.7.*", "1.8.*", "1.9.*"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -timeout 10m

      - name: Build
        run: go build ./...

  # lint job disabled: golangci-lint v1.64.x (latest as of 2026-04) was compiled
  # with Go 1.24 and refuses to run against a go.mod targeting Go 1.25+.
  # Re-enable once golangci-lint releases a version compiled with Go 1.25.
  # go vet (in build-and-test) continues to catch type/static errors in the meantime.
